name: Daily Theme Leadership and Pages
on:
  schedule:
    - cron: '0 14 * * *' # 19:30 Asia/Kolkata; GitHub may delay starts
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Independently acquire and validate completed EOD data
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['client/**','pipeline/**','shared/**','tests/**','package*.json','vite.config.ts','.github/workflows/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: theme-daily
  cancel-in-progress: false
jobs:
  refresh-and-deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache/restore@v5
        with:
          path: pipeline/cache
          key: theme-own-market-${{ runner.os }}-${{ github.run_id }}
          restore-keys: theme-own-market-${{ runner.os }}-
      - name: Install and test
        run: |
          pip install -r pipeline/requirements.txt
          npm ci --prefer-offline
          python -m unittest discover -s tests -v
          npm run check
      - name: Independently acquire completed EOD
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data)
        shell: bash
        run: |
          set -euo pipefail
          python pipeline/run.py 2>&1 | tee /tmp/theme-scan.log
      - uses: actions/cache/save@v5
        if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.refresh_data))
        with:
          path: pipeline/cache
          key: theme-own-market-${{ runner.os }}-${{ github.run_id }}
      - name: Commit validated snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add client/public/data snapshots pipeline/classifications.json pipeline/benchmark_midsmall400.csv
          if ! git diff --cached --quiet; then
            git commit -m "Update validated theme EOD snapshot [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push
          fi
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/public
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          timeout: 1200000
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: theme-run-diagnostics
          path: /tmp/theme-scan.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: own-market-cache-for-diagnosis
          path: pipeline/cache
          retention-days: 3
